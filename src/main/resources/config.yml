# ==================== AurexaHunger (1.8.8) ====================
# Codes couleur avec & ; placeholders avec %nom%
# Les arènes (région, lobby, spawns, panneaux) sont créées en jeu avec /hg create <nom> et enregistrées dans arenas.yml
game:
  min-players: 2          # valeurs par défaut des NOUVELLES arènes (/hg setplayers <nom> <min> <max>)
  max-players: 24
  lobby-countdown: 30     # secondes avant le début
  pvp-delay: 180          # secondes avant l'activation du PvP (phase passive)
  end-delay: 15           # secondes avant le retour au lobby après la victoire

arena:
  grid: 4                 # 4 => grille 4x4 = 16 zones numérotées de 1 à 16, sur la zone sélectionnée
  spawn-radius: 12        # cercle de départ, utilisé seulement s'il manque des spawns (/hg setspawn)
  enforce-height: false   # true = la hauteur de la sélection est aussi une limite

zones:
  passive: [1, 4, 13, 16] # zones où le PvP est TOUJOURS interdit (ex: les coins)

event:
  enabled: true
  first-delay: 240        # secondes avant la 1ère zone d'event
  interval: 120           # pause entre deux events
  warning: 20             # prévenir X secondes avant l'activation
  duration: 60            # durée de l'event
  damage: 2.0             # dégâts par seconde dans la zone d'event (2.0 = 1 coeur)
  lightning: true         # éclairs visuels dans la zone d'event

chests:
  enabled: true
  per-zone: 3             # coffres aléatoires par zone (16 zones x 3 = 48 coffres)
  center-count: 6         # coffres de la cornucopia (loot rare)
  center-radius: 4        # rayon de la cornucopia autour du centre
  per-tick: 3             # coffres posés / rechargés par tick (évite le lag)
  refill-interval: 300    # secondes entre deux rechargements (0 = jamais)
  items-normal: [3, 6]    # nombre d'objets min/max dans un coffre normal
  items-rare: [6, 10]     # nombre d'objets min/max dans un coffre de cornucopia

